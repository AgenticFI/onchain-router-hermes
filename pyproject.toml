[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-onchain-router"
version = "0.1.0"
description = "AgenticFI Onchain Router provider and bounded media tools for Hermes Agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AgenticFI" }]
requires-python = ">=3.11,<3.14"
keywords = ["hermes-agent", "agenticfi", "x402", "llm", "buyer-runtime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "pyyaml==6.0.3",
  "pytest==9.0.3",
]

[project.entry-points."hermes_agent.plugins"]
onchain-router = "onchain_router_hermes"

[project.scripts]
hermes-onchain-router = "onchain_router_hermes.cli:main"

[project.urls]
Homepage = "https://llm.agenticfi.wtf/docs/hermes"
Documentation = "https://llm.agenticfi.wtf/docs/hermes"
Repository = "https://github.com/AgenticFI/onchain-router-hermes"
Issues = "https://github.com/AgenticFI/onchain-router-hermes/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onchain_router_hermes = ["plugin.yaml", "skills/onchain-router/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
